<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" fill="none" aria-hidden="true">
  <!-- Swappable germ art: replace this file to change the character. -->
  <ellipse cx="60" cy="108" rx="28" ry="6" fill="#000" opacity=".12"/>
  <g>
    <!-- little arms -->
    <ellipse cx="18" cy="58" rx="12" ry="8" fill="#2FAA78" transform="rotate(-20 18 58)"/>
    <ellipse cx="102" cy="58" rx="12" ry="8" fill="#2FAA78" transform="rotate(20 102 58)"/>
    <!-- body -->
    <ellipse cx="60" cy="62" rx="38" ry="42" fill="#3DBF8C"/>
    <ellipse cx="60" cy="58" rx="30" ry="34" fill="#56D4A0"/>
    <!-- tuft -->
    <path d="M52 24c2-14 14-18 16-4 4-10 16-8 14 4" stroke="#2FAA78" stroke-width="8" stroke-linecap="round" fill="none"/>
    <!-- cheeks -->
    <ellipse cx="34" cy="70" rx="8" ry="5" fill="#FF8FA3" opacity=".85"/>
    <ellipse cx="86" cy="70" rx="8" ry="5" fill="#FF8FA3" opacity=".85"/>
    <!-- sly eyes -->
    <ellipse cx="44" cy="56" rx="9" ry="10" fill="#fff"/>
    <ellipse cx="76" cy="56" rx="9" ry="10" fill="#fff"/>
    <circle cx="47" cy="58" r="4.5" fill="#1A3A2E"/>
    <circle cx="79" cy="58" r="4.5" fill="#1A3A2E"/>
    <circle cx="48.5" cy="56.5" r="1.5" fill="#fff"/>
    <circle cx="80.5" cy="56.5" r="1.5" fill="#fff"/>
    <!-- mischievous brows -->
    <path d="M34 46c6-4 14-2 18 2" stroke="#1A3A2E" stroke-width="3.5" stroke-linecap="round"/>
    <path d="M68 48c5-5 14-6 20-1" stroke="#1A3A2E" stroke-width="3.5" stroke-linecap="round"/>
    <!-- grin -->
    <path d="M44 78c5 8 27 8 32 0" stroke="#1A3A2E" stroke-width="3.5" stroke-linecap="round"/>
    <path d="M52 80c3 4 13 4 16 0" fill="#FF6B7A"/>
  </g>
</svg>
